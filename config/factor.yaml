# 因子分类定义
factor_categories:
  # 时序因子（所有新增因子都用时序填充）
  time_series_factors:
    # ----- 原有时序因子 -----
    - price_volume_divergence
    - price_volume_strength
    - volatility_5d
    - volatility_10d
    - volatility_20d
    - volatility_60d
    - volatility_120d
    - return_120d
    - simple_return_120d
    - momentum_120d
    # ----- 新增趋势因子 -----
    - bias_20d
    - donchian_breakout
    - macd_slope
    - hurst_exp
    - adam_symmetry
    # ----- 新增量价因子 -----
    - vmom_20d
    - vp_coordination
    # ----- 新增波动因子 -----
    - downside_vol_20d
    # ----- 新增高低价回归因子 -----
    - vrrs_20d
    - hsrs_beta
    - hsrs_residual_vol
    - channel_strength
    - hl_beta_20d
    - hl_correlation_20d
    - range_extension
    - asymmetry_beta
    # ----- 新增多维回归因子 -----
    - ohlc_structure
    - trend_structure_coef
    # ----- 新增中长期因子 -----
    - vrrs_60d
    - hl_beta_60d
    - channel_strength_60d
    - long_term_channel_beta

  # 估值因子
  valuation_factors:
    - ep
    - bp
    - sp
    - value_score
    - pe_industry_rank
    - pb_industry_rank

  # 无需缩尾的因子（极值本身是因子的核心判断依据）
  no_winsorize_factors:
    - donchian_breakout       # 0-1区间值，本身就是位置
    - hurst_exp               # 0-1区间值，长程记忆性指数
    - adam_symmetry           # 对称性评分，极端值有意义
    - hl_beta_20d             # Beta值，极端值代表趋势强度
    - hl_correlation_20d      # 相关系数，-1到1之间
    - hl_beta_60d             # 长期Beta，极端值有意义
    - price_position          # 0-1区间值
    - boll_position           # 布林带位置
    - vp_coordination         # -1到1之间
    - ohlc_structure          # K线结构因子

  # 需要中性化的因子（仅添加受市值影响大的因子）
  neutralize_factors:
    - return_1d
    - return_3d
    - return_5d
    - return_10d
    - return_20d
    - return_60d
    - return_120d
    - simple_return_1d
    - simple_return_3d
    - simple_return_5d
    - simple_return_10d
    - simple_return_20d
    - simple_return_60d
    - simple_return_120d
    - momentum_5d
    - momentum_20d
    - momentum_60d
    - momentum_120d
    - momentum_acceleration
    - reversal_1d
    - reversal_5d
    - reversal_120d
    - volatility_5d
    - volatility_10d
    - volatility_20d
    - volatility_60d
    - volatility_120d
    - volatility_change
    - volatility_long_term_dev
    - low_volatility
    - overnight_return
    - overnight_momentum
    - open_gap
    - gap_ratio
    - intraday_return
    - intraday_strength
    - high_low_ratio
    - price_position
    - volume_relative_strength
    - price_volume_divergence
    - price_volume_strength
    - ma5_slope
    - ma10_slope
    - ma_slope_diff
    - amount_concentration
    - volatility_anomaly
    - ep
    - bp
    - sp
    - revenue_growth
