# ============================================================
# 因子计算引擎配置文件
# ============================================================

# 数据库配置
database:
  # 数据库连接URL，支持 PostgreSQL / SQLite
  db_url: "postgresql://postgres:z2c2h088QQ@localhost:5432/stock_analysis"
  # 批量读取数据的块大小
  chunk_size: 50000

# 预处理参数
preprocess:
  # 缩尾处理的分位数边界 [下界, 上界]
  winsorize_limit: [0.025, 0.975]
  # 新股上市天数阈值，低于此值的新股将被过滤
  list_day_threshold: 120
  # 缺失值前向填充的最大天数
  fill_limit: 5
  # 相关性阈值（用于因子筛选）
  corr_threshold: 0.8

# 计算窗口配置
windows:
  # 收益率计算窗口（天数）
  return_windows: [1, 3, 5, 10, 20, 60, 120]
  # 波动率计算窗口（天数）
  volatility_windows: [5, 10, 20, 60, 120]
  # 动量因子后缀
  momentum_suffixes: ["5d", "20d", "60d", "120d"]
  # 反转因子后缀
  reversal_suffixes: ["1d", "5d", "120d"]

# 常量参数
constants:
  # 数值计算精度（防止除零）
  eps: 1.0e-12
  # 分组计算时的最小有效股票数
  min_valid_stocks: 20
  # 大盘数据保留的最大天数
  max_market_dates: 1200

# 增量计算配置
incremental:
  # 增量计算的最大日期间隔（天数），超过此值触发全量计算
  max_days_gap: 10

