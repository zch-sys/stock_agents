# 大盘/板块数据收集器配置
market_collector:
  # 默认监控的大盘指数（代码: 名称）
  default_indices:
    '000001.SH': '上证指数'
    '399001.SZ': '深证成指'
    '399006.SZ': '创业板指'
  # 数据保留天数（超过则清理）
  data_retention_days: 1200
  # 首次收集天数（历史数据回溯天数）
  initial_collect_days: 1200
  # 板块聚合的最小股票数量（低于该值不生成板块数据）
  min_stock_count: 50
  # 单个行业的最小股票数量（低于该值跳过该行业）
  min_industry_stocks: 2
  # 涨跌幅合理范围（过滤异常值）
  pct_chg_range: [-20, 20]
  # API请求间隔（秒，避免触发限流）
  request_interval: 0.1

# 个股新闻爬虫配置（东方财富股吧）
crawler:
  time_range_days: 7          # 首次爬取时间范围（天）
  page_load_timeout: 15
  wait_time: 10
  headless: false             # 无头模式
  retention_days: 30         # 数据保留天数（新增）
  
  anti_scraping:
    min_delay: 0.5            # 最小延迟（秒）
    max_delay: 2.0            # 最大延迟（秒）
    scroll_chance: 0.7        # 随机滚动概率
    max_news_per_run: 50      # 单股票最大爬取数
    batch_sleep: 5            # 批处理休息时间
    batch_size: 5             # 每批处理条数

# 大盘新闻爬虫配置（东方财富财经新闻）
market_news_crawler:
  page_load_timeout: 15
  wait_time: 10
  headless: True             # 无头模式
  retention_days: 15           # 数据保留天数
  initial_collect_days: 15     # 首次收集天数（历史新闻回溯）
  
  anti_scraping:
    min_delay: 0.5            # 最小延迟（秒）
    max_delay: 2.0            # 最大延迟（秒）
    scroll_chance: 0.7        # 随机滚动概率
    max_news_per_run: 50      # 单次最大爬取数
    batch_sleep: 5            # 页间休息时间
    batch_size: 5             # 每批处理条数

